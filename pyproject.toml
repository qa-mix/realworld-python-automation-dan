[project]
name = "realworld-python-automation-dan"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

